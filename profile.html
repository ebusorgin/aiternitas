<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Aiternitas</title>
    <link rel="stylesheet" href="styles/profile.css">
</head>
<body>
    <div class="profile-container">
        <div class="profile-header">
            <a href="/" class="back-link">← На главную</a>
            <button id="logoutBtn" class="btn-logout">Выйти</button>
        </div>

        <div class="profile-card">
            <div class="profile-avatar-section">
                <div class="avatar-container">
                    <img id="avatarImg" src="data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='200' height='200' fill='%23667eea'/%3E%3Ctext x='50%25' y='50%25' font-family='Arial' font-size='80' fill='white' text-anchor='middle' dy='.3em'%3E%F0%9F%91%A4%3C/text%3E%3C/svg%3E" alt="Аватар" class="avatar">
                    <label for="avatarInput" class="avatar-upload-label">
                        <span>📷</span>
                        <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                    </label>
                </div>
                <p class="avatar-hint">Нажмите на аватар для загрузки</p>
            </div>

            <div class="profile-info">
                <h1>Личный кабинет</h1>

                <div class="profile-data">
                    <div class="data-item">
                        <label>Имя</label>
                        <div class="data-value editable" id="nameContainer">
                            <span id="nameDisplay" class="display-value"></span>
                            <input type="text" id="nameInput" class="edit-input" style="display: none;">
                            <button class="edit-btn" id="editNameBtn" title="Редактировать имя">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="data-item">
                        <label>Email</label>
                        <div class="data-value">
                            <span id="emailDisplay" class="display-value"></span>
                        </div>
                    </div>

                    <div class="data-item">
                        <label>Дата регистрации</label>
                        <div class="data-value">
                            <span id="createdAtDisplay" class="display-value"></span>
                        </div>
                    </div>
                </div>

                <div id="message" class="message" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="js/profile.js"></script>
</body>
</html>
