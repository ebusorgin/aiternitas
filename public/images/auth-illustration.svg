<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background circles -->
  <circle cx="100" cy="80" r="60" fill="url(#grad1)" opacity="0.4"/>
  <circle cx="300" cy="220" r="80" fill="url(#grad1)" opacity="0.3"/>
  <circle cx="350" cy="50" r="40" fill="url(#grad1)" opacity="0.5"/>
  
  <!-- Main lock icon -->
  <g transform="translate(200, 150)">
    <!-- Lock body -->
    <rect x="-35" y="-20" width="70" height="50" rx="8" fill="url(#grad2)" stroke="#667eea" stroke-width="2"/>
    <!-- Lock shackle -->
    <path d="M -35 -20 Q -35 -45, -10 -45 Q 10 -45, 10 -20" stroke="#667eea" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="0" cy="5" r="8" fill="#667eea" opacity="0.6"/>
    <rect x="-2" y="5" width="4" height="15" fill="#667eea" opacity="0.6"/>
  </g>
  
  <!-- Floating particles -->
  <circle cx="80" cy="180" r="4" fill="#667eea" opacity="0.6">
    <animate attributeName="cy" values="180;160;180" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="100" r="3" fill="#764ba2" opacity="0.5">
    <animate attributeName="cy" values="100;120;100" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="250" r="5" fill="#667eea" opacity="0.4">
    <animate attributeName="cy" values="250;230;250" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>

