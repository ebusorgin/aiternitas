version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: aiternitas-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Web UI
    environment:
      RABBITMQ_DEFAULT_USER: aiternitas
      RABBITMQ_DEFAULT_PASS: aiternitassecret
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: aiternitas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  rabbitmq_data:
  redis_data:
