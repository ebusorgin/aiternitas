name: Setup SMTP Configuration

on:
  workflow_dispatch:
    inputs:
      smtp_host:
        description: 'SMTP Host (e.g., smtp.gmail.com)'
        required: false
        type: string
      smtp_port:
        description: 'SMTP Port (587 for TLS, 465 for SSL)'
        required: false
        type: string
        default: '587'
      smtp_user:
        description: 'SMTP Username/Email'
        required: false
        type: string
      smtp_pass:
        description: 'SMTP Password/App Password'
        required: false
        type: string
      smtp_from:
        description: 'From Email Address'
        required: false
        type: string
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - check
          - setup
          - test
        default: 'check'

jobs:
  setup-smtp:
    name: Setup SMTP on Server
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SERVER_HOST || '82.146.44.126' }}
      SSH_USER: ${{ secrets.SERVER_USER || 'root' }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SMTP_HOST: ${{ inputs.smtp_host || secrets.SMTP_HOST || '' }}
      SMTP_PORT: ${{ inputs.smtp_port || secrets.SMTP_PORT || '587' }}
      SMTP_USER: ${{ inputs.smtp_user || secrets.SMTP_USER || '' }}
      SMTP_PASS: ${{ inputs.smtp_pass || secrets.SMTP_PASS || '' }}
      SMTP_FROM: ${{ inputs.smtp_from || secrets.SMTP_FROM || '' }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://aiternitas.ru' }}

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "⚠️  SSH_PRIVATE_KEY secret is not set."
            exit 1
          fi
          echo "✅ SSH key is available"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Check current SMTP settings
        if: inputs.action == 'check'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} <<'EOSSH'
            echo "=== Current SMTP Settings ==="
            echo ""
            echo "From .env file:"
            cd /opt/aiternitas-main
            if [ -f .env ]; then
              grep -E '^SMTP_|^FRONTEND_URL=' .env 2>/dev/null || echo "No SMTP settings in .env"
            else
              echo ".env file not found"
            fi
            echo ""
            echo "From systemd service:"
            systemctl show aiternitas-main.service | grep -E 'Environment' || echo "No environment variables in systemd"
            echo ""
            echo "=== Recent Email Logs ==="
            journalctl -u aiternitas-main.service -n 100 --no-pager | grep -E 'SMTP|Email|email|📧|✅|❌' | tail -30 || echo "No email logs found"
          EOSSH

      - name: Setup SMTP configuration
        if: inputs.action == 'setup'
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASS" ]; then
            echo "❌ SMTP_HOST, SMTP_USER, and SMTP_PASS must be provided"
            exit 1
          fi
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} <<EOSSH
            set -e
            cd /opt/aiternitas-main
            
            echo "=== Setting up SMTP configuration ==="
            
            # Backup existing .env if it exists
            if [ -f .env ]; then
              cp .env .env.backup.\$(date +%Y%m%d_%H%M%S)
              echo "✅ Backed up existing .env"
            fi
            
            # Create or update .env file
            if [ ! -f .env ]; then
              touch .env
              echo "✅ Created .env file"
            fi
            
            # Remove old SMTP settings
            sed -i '/^SMTP_/d' .env
            sed -i '/^FRONTEND_URL=/d' .env
            
            # Add new SMTP settings
            echo "" >> .env
            echo "# SMTP Configuration for Email Verification" >> .env
            echo "SMTP_HOST=$SMTP_HOST" >> .env
            echo "SMTP_PORT=$SMTP_PORT" >> .env
            echo "SMTP_USER=$SMTP_USER" >> .env
            echo "SMTP_PASS=$SMTP_PASS" >> .env
            if [ -n "$SMTP_FROM" ]; then
              echo "SMTP_FROM=$SMTP_FROM" >> .env
            else
              echo "SMTP_FROM=$SMTP_USER" >> .env
            fi
            echo "FRONTEND_URL=$FRONTEND_URL" >> .env
            
            echo "✅ SMTP settings added to .env"
            echo ""
            echo "=== Updated .env SMTP settings ==="
            grep -E '^SMTP_|^FRONTEND_URL=' .env
            
            # Update systemd service with environment variables
            echo ""
            echo "=== Updating systemd service ==="
            SERVICE_FILE="/etc/systemd/system/aiternitas-main.service"
            
            if [ -f "$SERVICE_FILE" ]; then
              # Remove old Environment lines
              sed -i '/^Environment=SMTP_/d' "$SERVICE_FILE"
              sed -i '/^Environment=FRONTEND_URL/d' "$SERVICE_FILE"
              
              # Add new Environment lines before [Service] section or at the end of [Service]
              if grep -q "\[Service\]" "$SERVICE_FILE"; then
                # Add after [Service] line
                sed -i "/\[Service\]/a Environment=SMTP_HOST=$SMTP_HOST\nEnvironment=SMTP_PORT=$SMTP_PORT\nEnvironment=SMTP_USER=$SMTP_USER\nEnvironment=SMTP_PASS=$SMTP_PASS" "$SERVICE_FILE"
                if [ -n "$SMTP_FROM" ]; then
                  sed -i "/\[Service\]/a Environment=SMTP_FROM=$SMTP_FROM" "$SERVICE_FILE"
                else
                  sed -i "/\[Service\]/a Environment=SMTP_FROM=$SMTP_USER" "$SERVICE_FILE"
                fi
                sed -i "/\[Service\]/a Environment=FRONTEND_URL=$FRONTEND_URL" "$SERVICE_FILE"
              else
                # Add at the end of file
                echo "" >> "$SERVICE_FILE"
                echo "Environment=SMTP_HOST=$SMTP_HOST" >> "$SERVICE_FILE"
                echo "Environment=SMTP_PORT=$SMTP_PORT" >> "$SERVICE_FILE"
                echo "Environment=SMTP_USER=$SMTP_USER" >> "$SERVICE_FILE"
                echo "Environment=SMTP_PASS=$SMTP_PASS" >> "$SERVICE_FILE"
                if [ -n "$SMTP_FROM" ]; then
                  echo "Environment=SMTP_FROM=$SMTP_FROM" >> "$SERVICE_FILE"
                else
                  echo "Environment=SMTP_FROM=$SMTP_USER" >> "$SERVICE_FILE"
                fi
                echo "Environment=FRONTEND_URL=$FRONTEND_URL" >> "$SERVICE_FILE"
              fi
              
              # Reload systemd and restart service
              systemctl daemon-reload
              echo "✅ Systemd daemon reloaded"
              
              systemctl restart aiternitas-main.service
              echo "✅ Service restarted"
              
              sleep 3
              systemctl status aiternitas-main.service --no-pager | head -15 || true
            else
              echo "⚠️  Service file not found at $SERVICE_FILE"
            fi
            
            echo ""
            echo "=== Verification ==="
            echo "Checking if service is running with new settings..."
            sleep 2
            journalctl -u aiternitas-main.service -n 20 --no-pager | grep -E 'SMTP|📧' || echo "No SMTP logs yet"
          EOSSH

      - name: Test SMTP connection
        if: inputs.action == 'test'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} <<'EOSSH'
            echo "=== Testing SMTP Configuration ==="
            cd /opt/aiternitas-main
            
            # Check if service is running
            if systemctl is-active --quiet aiternitas-main.service; then
              echo "✅ Service is running"
              
              # Check recent logs for SMTP
              echo ""
              echo "=== Recent SMTP logs ==="
              journalctl -u aiternitas-main.service -n 50 --no-pager | grep -E 'SMTP|Email|email|📧|✅|❌' | tail -20 || echo "No SMTP logs found"
              
              echo ""
              echo "=== Current Environment Variables ==="
              systemctl show aiternitas-main.service | grep -E 'Environment' || echo "No environment variables"
            else
              echo "❌ Service is not running"
              systemctl status aiternitas-main.service --no-pager | head -10
            fi
          EOSSH

