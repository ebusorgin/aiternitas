name: Deploy Aiternitas Main to Production

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Aiternitas Main to aiternitas.ru
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SERVER_HOST || '82.146.44.126' }}
      SSH_USER: ${{ secrets.SERVER_USER || 'root' }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check required secrets
        shell: bash
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "⚠️  SSH_PRIVATE_KEY secret is not set. Deployment steps will be skipped."
            echo "skip_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_deploy=false" >> "$GITHUB_OUTPUT"
          fi
        id: secrets_check

      - name: Setup SSH key
        if: steps.secrets_check.outputs.skip_deploy == 'false'
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Добавляем SSH опции для стабильности соединения
          cat >> ~/.ssh/config << EOF
          Host ${{ env.SSH_HOST }}
            StrictHostKeyChecking no
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 60
            ServerAliveCountMax 3
            ConnectTimeout 30
            TCPKeepAlive yes
          EOF
          ssh-keyscan -H ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Тестируем подключение с повторными попытками
          echo "Testing SSH connection..."
          for i in {1..3}; do
            if ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 -o StrictHostKeyChecking=no ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "echo 'SSH connection successful'"; then
              echo "✅ SSH connection established on attempt $i"
              break
            else
              echo "⚠️ SSH connection attempt $i failed, retrying..."
              sleep 5
            fi
          done

      - name: Install dependencies
        if: steps.secrets_check.outputs.skip_deploy == 'false'
        run: |
          npm ci

      - name: Build application
        if: steps.secrets_check.outputs.skip_deploy == 'false'
        run: |
          npm run build

      - name: Deploy to server
        if: steps.secrets_check.outputs.skip_deploy == 'false'
        run: |
          set -e
          SSH_HOST="${{ env.SSH_HOST }}"
          SSH_USER="${{ env.SSH_USER }}"
          REPO_DIR="/opt/aiternitas-main"
          
          echo "=== Deploying to server ==="
          
          # SSH опции для всех команд
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=3"
          
          # Создаем директории на сервере
          echo "Creating directories on server..."
          for i in {1..3}; do
            if ssh $SSH_OPTS ${SSH_USER}@${SSH_HOST} "mkdir -p $REPO_DIR/dist $REPO_DIR/uploads/avatars $REPO_DIR/public/images"; then
              echo "✅ Directories created on attempt $i"
              break
            else
              echo "⚠️ Attempt $i failed, retrying..."
              sleep 3
            fi
          done
          
          # Копируем серверные файлы (без dist, uploads, node_modules)
          echo "Copying server files..."
          for i in {1..3}; do
            if rsync -avz --delete \
              -e "ssh $SSH_OPTS" \
              --exclude='.git' \
              --exclude='node_modules' \
              --exclude='.github' \
              --exclude='dist' \
              --exclude='uploads' \
              --exclude='*.log' \
              --exclude='.env' \
              --exclude='.env.local' \
              --exclude='src' \
              ./ ${SSH_USER}@${SSH_HOST}:${REPO_DIR}/; then
              echo "✅ Server files copied on attempt $i"
              break
            else
              echo "⚠️ Rsync attempt $i failed, retrying..."
              sleep 3
            fi
          done
          
          # Копируем собранный dist на сервер (сборка уже выполнена на GitHub runner)
          echo "Copying pre-built dist folder..."
          for i in {1..3}; do
            if rsync -avz --delete \
              -e "ssh $SSH_OPTS" \
              ./dist/ ${SSH_USER}@${SSH_HOST}:${REPO_DIR}/dist/; then
              echo "✅ Dist folder copied on attempt $i"
              break
            else
              echo "⚠️ Dist copy attempt $i failed, retrying..."
              sleep 3
            fi
          done
          
          # Устанавливаем только production зависимости и перезапускаем сервис
          ssh $SSH_OPTS ${SSH_USER}@${SSH_HOST} <<EOSSH
            set -e
            cd $REPO_DIR
            
            echo ""
            echo "=== Installing production dependencies ==="
            npm install --omit=dev
            
            echo ""
            echo "=== Restarting service ==="
            if systemctl restart aiternitas-main.service; then
              echo "✅ Service restarted"
              sleep 2
              systemctl status aiternitas-main.service --no-pager | head -10 || true
            else
              echo "⚠️  Service restart failed or service not found"
            fi
            echo ""
          EOSSH

      - name: Verify deployment
        if: steps.secrets_check.outputs.skip_deploy == 'false'
        run: |
          set -e
          SSH_HOST="${{ env.SSH_HOST }}"
          SSH_USER="${{ env.SSH_USER }}"
          
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=3"
          ssh $SSH_OPTS ${SSH_USER}@${SSH_HOST} <<'EOSSH'
            set -e
            
            echo "=== Aiternitas Main Service Status ==="
            systemctl status aiternitas-main.service --no-pager | head -10 || echo "Service not found"
            
            echo ""
            echo "=== Deployment Directory ==="
            cd /opt/aiternitas-main
            echo "Directory: $(pwd)"
            echo "Package version: $(cat package.json | grep '"version"' | head -1 || echo 'unknown')"
            echo "Dist directory exists: $([ -d dist ] && echo 'yes' || echo 'no')"
            
            echo ""
            echo "=== Service Health ==="
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001 || echo "000")
            echo "Aiternitas Main HTTP status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ Aiternitas Main service is responding"
            else
              echo "⚠️ Aiternitas Main service may not be responding correctly"
            fi
          EOSSH

      - name: Skip notice
        if: steps.secrets_check.outputs.skip_deploy == 'true'
        run: |
          echo "🔕 Deployment skipped because SSH_PRIVATE_KEY secret is not configured."
