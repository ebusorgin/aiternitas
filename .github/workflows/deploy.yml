name: Deploy Aiternitas Main to Production

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Aiternitas Main to aiternitas.ru
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SERVER_HOST || '82.146.44.126' }}
      SSH_USER: ${{ secrets.SERVER_USER || 'root' }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check required secrets
        shell: bash
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "⚠️  SSH_PRIVATE_KEY secret is not set. Deployment steps will be skipped."
            echo "skip_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_deploy=false" >> "$GITHUB_OUTPUT"
          fi
        id: secrets_check

      - name: Setup SSH key
        if: steps.secrets_check.outputs.skip_deploy == 'false'
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Install dependencies
        if: steps.secrets_check.outputs.skip_deploy == 'false'
        run: |
          npm ci

      - name: Build application
        if: steps.secrets_check.outputs.skip_deploy == 'false'
        run: |
          npm run build

      - name: Deploy to server
        if: steps.secrets_check.outputs.skip_deploy == 'false'
        run: |
          set -e
          SSH_HOST="${{ env.SSH_HOST }}"
          SSH_USER="${{ env.SSH_USER }}"
          REPO_DIR="/opt/aiternitas-main"
          
          echo "=== Deploying to server ==="
          
          # Создаем директорию на сервере если не существует
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "mkdir -p $REPO_DIR"
          
          # Копируем все файлы на сервер (кроме node_modules и .git)
          echo "Copying files to server..."
          if command -v rsync &> /dev/null; then
            rsync -avz --delete \
              -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
              --exclude='.git' \
              --exclude='node_modules' \
              --exclude='.github' \
              --exclude='dist' \
              --exclude='uploads' \
              --exclude='*.log' \
              --exclude='.env' \
              --exclude='.env.local' \
              ./ ${SSH_USER}@${SSH_HOST}:${REPO_DIR}/
          else
            # Альтернативный метод с tar, если rsync недоступен
            echo "Using tar method (rsync not available)..."
            tar --exclude='.git' \
                --exclude='node_modules' \
                --exclude='.github' \
                --exclude='dist' \
                --exclude='uploads' \
                --exclude='*.log' \
                --exclude='.env' \
                --exclude='.env.local' \
                -czf - . | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "cd $REPO_DIR && tar -xzf -"
          fi
          
          # Убеждаемся, что папка uploads существует на сервере
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "mkdir -p $REPO_DIR/uploads/avatars"
          
          # Выполняем команды на сервере
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} <<EOSSH
            set -e
            cd $REPO_DIR
            
            echo ""
            echo "=== Installing dependencies on server ==="
            npm ci --production=false || npm install
            
            echo ""
            echo "=== Building application on server ==="
            npm run build || {
              echo "❌ Build failed"
              exit 1
            }
            echo "✅ Build completed"
            
            echo ""
            echo "=== Configuring SMTP (if credentials provided) ==="
            if [ -n "${{ secrets.SMTP_HOST }}" ] && [ -n "${{ secrets.SMTP_USER }}" ] && [ -n "${{ secrets.SMTP_PASS }}" ]; then
              echo "SMTP credentials found, configuring..."
              
              # Update .env
              if [ ! -f .env ]; then
                touch .env
              fi
              
              # Remove old SMTP settings
              sed -i '/^SMTP_/d' .env
              sed -i '/^FRONTEND_URL=/d' .env
              
              # Add new SMTP settings
              {
                echo ""
                echo "# SMTP Configuration"
                echo "SMTP_HOST=${{ secrets.SMTP_HOST }}"
                echo "SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}"
                echo "SMTP_USER=${{ secrets.SMTP_USER }}"
                echo "SMTP_PASS=${{ secrets.SMTP_PASS }}"
                echo "SMTP_FROM=${{ secrets.SMTP_FROM || secrets.SMTP_USER }}"
                echo "FRONTEND_URL=${{ secrets.FRONTEND_URL || 'https://aiternitas.ru' }}"
              } >> .env
              
              echo "✅ SMTP settings updated in .env"
              
              # Update systemd service
              SERVICE_FILE="/etc/systemd/system/aiternitas-main.service"
              if [ -f "\$SERVICE_FILE" ]; then
                # Remove old Environment
                sed -i '/^Environment=SMTP_/d' "\$SERVICE_FILE"
                sed -i '/^Environment=FRONTEND_URL/d' "\$SERVICE_FILE"
                
                # Add new Environment after [Service]
                TEMP_FILE=\$(mktemp)
                awk -v host="${{ secrets.SMTP_HOST }}" -v port="${{ secrets.SMTP_PORT || '587' }}" -v user="${{ secrets.SMTP_USER }}" -v pass="${{ secrets.SMTP_PASS }}" -v from="${{ secrets.SMTP_FROM || secrets.SMTP_USER }}" -v url="${{ secrets.FRONTEND_URL || 'https://aiternitas.ru' }}" '
                  /^\[Service\]/ {
                      print
                      print "Environment=SMTP_HOST=" host
                      print "Environment=SMTP_PORT=" port
                      print "Environment=SMTP_USER=" user
                      print "Environment=SMTP_PASS=" pass
                      print "Environment=SMTP_FROM=" from
                      print "Environment=FRONTEND_URL=" url
                      next
                  }
                  { print }
                ' "\$SERVICE_FILE" > "\$TEMP_FILE"
                mv "\$TEMP_FILE" "\$SERVICE_FILE"
                
                echo "✅ Systemd service updated"
                systemctl daemon-reload
              fi
            else
              echo "⚠️  SMTP credentials not found in secrets, skipping SMTP configuration"
              echo "   Add SMTP_HOST, SMTP_USER, SMTP_PASS to GitHub Secrets to enable email verification"
            fi
            
            echo ""
            echo "=== Restarting service ==="
            if systemctl restart aiternitas-main.service; then
              echo "✅ Service restarted"
              sleep 2
              systemctl status aiternitas-main.service --no-pager | head -10 || true
            else
              echo "⚠️  Service restart failed or service not found"
            fi
            echo ""
          EOSSH

      - name: Verify deployment
        if: steps.secrets_check.outputs.skip_deploy == 'false'
        run: |
          set -e
          SSH_HOST="${{ env.SSH_HOST }}"
          SSH_USER="${{ env.SSH_USER }}"
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} <<'EOSSH'
            set -e
            
            echo "=== Aiternitas Main Service Status ==="
            systemctl status aiternitas-main.service --no-pager | head -10 || echo "Service not found"
            
            echo ""
            echo "=== Deployment Directory ==="
            cd /opt/aiternitas-main
            echo "Directory: $(pwd)"
            echo "Package version: $(cat package.json | grep '"version"' | head -1 || echo 'unknown')"
            echo "Dist directory exists: $([ -d dist ] && echo 'yes' || echo 'no')"
            
            echo ""
            echo "=== Service Health ==="
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001 || echo "000")
            echo "Aiternitas Main HTTP status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ Aiternitas Main service is responding"
            else
              echo "⚠️ Aiternitas Main service may not be responding correctly"
            fi
          EOSSH

      - name: Skip notice
        if: steps.secrets_check.outputs.skip_deploy == 'true'
        run: |
          echo "🔕 Deployment skipped because SSH_PRIVATE_KEY secret is not configured."
