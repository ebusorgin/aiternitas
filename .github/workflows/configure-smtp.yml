name: Configure SMTP on Server

on:
  workflow_dispatch:
    inputs:
      smtp_host:
        description: 'SMTP Host (e.g., smtp.gmail.com)'
        required: false
        type: string
      smtp_port:
        description: 'SMTP Port (587 for TLS, 465 for SSL)'
        required: false
        type: string
        default: '587'
      smtp_user:
        description: 'SMTP Username/Email'
        required: false
        type: string
      smtp_pass:
        description: 'SMTP Password/App Password'
        required: false
        type: string
      smtp_from:
        description: 'From Email Address (optional)'
        required: false
        type: string
      action:
        description: 'Action'
        required: true
        type: choice
        options:
          - check
          - configure
        default: 'check'

jobs:
  configure:
    name: Configure SMTP
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SERVER_HOST || '82.146.44.126' }}
      SSH_USER: ${{ secrets.SERVER_USER || 'root' }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SMTP_HOST: ${{ inputs.smtp_host || secrets.SMTP_HOST || '' }}
      SMTP_PORT: ${{ inputs.smtp_port || secrets.SMTP_PORT || '587' }}
      SMTP_USER: ${{ inputs.smtp_user || secrets.SMTP_USER || '' }}
      SMTP_PASS: ${{ inputs.smtp_pass || secrets.SMTP_PASS || '' }}
      SMTP_FROM: ${{ inputs.smtp_from || secrets.SMTP_FROM || '' }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://aiternitas.ru' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check required secrets
        shell: bash
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "⚠️  SSH_PRIVATE_KEY secret is not set."
            exit 1
          fi
          echo "✅ SSH key is available"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Configure SMTP directly on server
        if: inputs.action == 'configure'
        run: |
          if [ -z "${{ env.SMTP_HOST }}" ] || [ -z "${{ env.SMTP_USER }}" ] || [ -z "${{ env.SMTP_PASS }}" ]; then
            echo "❌ SMTP_HOST, SMTP_USER, and SMTP_PASS must be provided"
            echo "   Set them in GitHub Secrets or workflow inputs"
            exit 1
          fi
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} <<EOSSH
            set -e
            REPO_DIR="/opt/aiternitas-main"
            SERVICE_NAME="aiternitas-main.service"
            SERVICE_FILE="/etc/systemd/system/\${SERVICE_NAME}"
            
            cd "\$REPO_DIR"
            
            echo "=== Настройка SMTP на сервере ==="
            echo ""
            
            # Backup .env
            if [ -f .env ]; then
              cp .env .env.backup.\$(date +%Y%m%d_%H%M%S)
              echo "✅ Создан backup .env"
            fi
            
            # Обновляем .env
            if [ ! -f .env ]; then
              touch .env
            fi
            
            # Удаляем старые SMTP настройки
            sed -i '/^SMTP_/d' .env
            sed -i '/^FRONTEND_URL=/d' .env
            
            # Добавляем новые
            {
              echo ""
              echo "# SMTP Configuration for Email Verification"
              echo "SMTP_HOST=${{ env.SMTP_HOST }}"
              echo "SMTP_PORT=${{ env.SMTP_PORT }}"
              echo "SMTP_USER=${{ env.SMTP_USER }}"
              echo "SMTP_PASS=${{ env.SMTP_PASS }}"
              echo "SMTP_FROM=${{ env.SMTP_FROM || env.SMTP_USER }}"
              echo "FRONTEND_URL=${{ env.FRONTEND_URL }}"
            } >> .env
            
            echo "✅ SMTP настройки добавлены в .env"
            echo ""
            echo "Настройки:"
            grep "^SMTP_\|^FRONTEND_URL=" .env
            
            # Обновляем systemd service
            if [ -f "\$SERVICE_FILE" ]; then
              echo ""
              echo "=== Обновление systemd service ==="
              
              # Backup
              cp "\$SERVICE_FILE" "\${SERVICE_FILE}.backup.\$(date +%Y%m%d_%H%M%S)"
              
              # Удаляем старые Environment
              sed -i '/^Environment=SMTP_/d' "\$SERVICE_FILE"
              sed -i '/^Environment=FRONTEND_URL/d' "\$SERVICE_FILE"
              
              # Добавляем новые Environment после [Service]
              TEMP_FILE=\$(mktemp)
              awk -v host="${{ env.SMTP_HOST }}" -v port="${{ env.SMTP_PORT }}" -v user="${{ env.SMTP_USER }}" -v pass="${{ env.SMTP_PASS }}" -v from="${{ env.SMTP_FROM || env.SMTP_USER }}" -v url="${{ env.FRONTEND_URL }}" '
                /^\[Service\]/ {
                    print
                    print "Environment=SMTP_HOST=" host
                    print "Environment=SMTP_PORT=" port
                    print "Environment=SMTP_USER=" user
                    print "Environment=SMTP_PASS=" pass
                    print "Environment=SMTP_FROM=" from
                    print "Environment=FRONTEND_URL=" url
                    next
                }
                { print }
              ' "\$SERVICE_FILE" > "\$TEMP_FILE"
              mv "\$TEMP_FILE" "\$SERVICE_FILE"
              
              echo "✅ Environment переменные добавлены"
              
              # Перезапускаем
              echo ""
              echo "=== Перезапуск сервиса ==="
              systemctl daemon-reload
              systemctl restart "\$SERVICE_NAME"
              sleep 3
              
              echo ""
              echo "=== Статус сервиса ==="
              systemctl status "\$SERVICE_NAME" --no-pager | head -15 || true
              
              echo ""
              echo "=== Проверка логов ==="
              sleep 2
              journalctl -u "\$SERVICE_NAME" -n 30 --no-pager | grep -E 'SMTP|📧' | tail -10 || echo "Пока нет логов SMTP"
            else
              echo "⚠️  Service file не найден"
            fi
            
            echo ""
            echo "✅ Настройка завершена!"
          EOSSH

      - name: Check current SMTP settings
        if: inputs.action == 'check'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} <<'EOSSH'
            echo "=== Current SMTP Configuration ==="
            echo ""
            cd /opt/aiternitas-main
            
            echo "1. .env file:"
            if [ -f .env ]; then
              echo "   SMTP settings:"
              grep -E '^SMTP_|^FRONTEND_URL=' .env 2>/dev/null || echo "   No SMTP settings found"
            else
              echo "   .env file not found"
            fi
            
            echo ""
            echo "2. Systemd service:"
            if systemctl show aiternitas-main.service > /dev/null 2>&1; then
              echo "   Environment variables:"
              systemctl show aiternitas-main.service | grep -E 'Environment=SMTP_|Environment=FRONTEND_URL' || echo "   No SMTP environment variables"
            else
              echo "   Service not found"
            fi
            
            echo ""
            echo "3. Recent email logs:"
            journalctl -u aiternitas-main.service -n 100 --no-pager | grep -E 'SMTP|Email|email|📧|✅|❌' | tail -20 || echo "   No email logs found"
            
            echo ""
            echo "4. Service status:"
            systemctl status aiternitas-main.service --no-pager | head -10 || echo "   Service status unavailable"
          EOSSH

